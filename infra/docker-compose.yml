# 로컬 실행 환경(작업진행.md A2, R0-07). 실행: 저장소 맨 위에서
#   docker compose -f infra/docker-compose.yml up --build
# 비밀번호는 infra/.env에만 둔다(저장소 제외). 처음 한 번 `python infra/scripts/init-local-env.py`로 만든다.
# 모든 포트는 이 컴퓨터(127.0.0.1)에만 연다. 이미지는 판 번호 + 지문으로 고정한다(A5-12).
name: commerce

services:
  mysql:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?infra/.env에 MYSQL_PASSWORD가 없다}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env에 MYSQL_ROOT_PASSWORD가 없다}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      # 이 컴퓨터의 3306은 따로 설치된 MySQL이 쓸 수 있어 3307로 연다(컨테이너 안은 3306).
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 비밀번호를 명령줄 인자가 아니라 환경변수(MYSQL_PWD)로 넘긴다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?infra/.env에 REDIS_PASSWORD가 없다}
      TZ: UTC
    # 비밀번호 없이는 명령을 받지 않는다. Redis는 캐시·대기열·요청 한도 전용이라 디스크에 남기지 않는다(A1).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no --save ''"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/commerce?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: ${MYSQL_PASSWORD:?infra/.env에 MYSQL_PASSWORD가 없다}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?infra/.env에 REDIS_PASSWORD가 없다}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ../frontend
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend

volumes:
  mysql-data:
