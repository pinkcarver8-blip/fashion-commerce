<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R0-03 토스 확인: 결제창</title>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  #pay { width: 100%; padding: 12px; font-size: 16px; }
</style>
</head>
<body>
<h1>주문서 (결제창, 카드)</h1>
<p>내 테스트 상점(API 개별 연동 키)으로 결제한다. 웹훅 확인용.</p>
<p id="summary"></p>
<button id="pay" disabled>카드로 결제하기</button>
<p id="error" style="color:#b00"></p>
<script>
  const orderId = new URLSearchParams(location.search).get('orderId');
  const report = (type, detail) => fetch('/api/page-events', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ orderId, type, detail: detail || '' })
  });
  const showError = (e) => {
    const text = `${e.code || ''}: ${e.message || e}`;
    document.getElementById('error').textContent = text;
    report('SDK_ERROR', text);
  };

  (async () => {
    // 금액과 주문명은 서버에 저장한 값을 쓴다
    const order = await (await fetch('/api/orders/' + encodeURIComponent(orderId))).json();
    if (!order.amount) { document.getElementById('error').textContent = order.code; return; }
    document.getElementById('summary').textContent =
      `${order.orderName} / ${order.amount.toLocaleString()}원 / 주문번호 ${order.orderId}`;

    const { apiClientKey } = await (await fetch('/api/config')).json();
    if (!apiClientKey) { document.getElementById('error').textContent = 'API 개별 연동 키 없음'; return; }
    const payment = TossPayments(apiClientKey).payment({ customerKey: TossPayments.ANONYMOUS });
    report('CHECKOUT_RENDERED', navigator.userAgent);

    const pay = document.getElementById('pay');
    pay.disabled = false;
    pay.onclick = async () => {
      await report('PAY_CLICKED', '');
      try {
        await payment.requestPayment({
          method: 'CARD',
          amount: { currency: 'KRW', value: order.amount },
          orderId: order.orderId,
          orderName: order.orderName,
          successUrl: location.origin + '/success.html',
          failUrl: location.origin + '/fail.html',
        });
      } catch (e) {
        showError(e);
      }
    };
  })().catch(showError);
</script>
</body>
</html>
