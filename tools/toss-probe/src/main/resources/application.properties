spring.application.name=toss-probe
# 이 PC에서만 접속한다. ngrok은 localhost로 들어온다(LocalOnlyFilter가 /probe/**를 막는다).
server.address=127.0.0.1
server.port=8080

# 저장소 루트 .env(저장소 제외)를 속성 파일로 읽는다. 값은 코드·로그에 남기지 않는다(A5-10).
spring.config.import=optional:file:../../.env[.properties]
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
