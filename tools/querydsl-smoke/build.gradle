// R0-04: QueryDSL OpenFeign 포크가 Boot 4.1 + Java 21 + MySQL 8.4에서 동작하는지 확인한다(ADR-007 입력).
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.pinkcarver8blip'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Boot가 관리하는 querydsl.version(5.1.0)은 원본(com.querydsl) 것이라 포크에는 버전을 직접 적는다.
def querydslVersion = '7.7'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	// @Entity를 읽어 Q클래스를 만든다. jpa 분류자는 포크 문서(tutorials/jpa)의 설정이다.
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:all'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
