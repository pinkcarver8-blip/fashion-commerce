# 화면 앱 두 개를 포트로 나눠 서빙하고, /api는 백엔드로 넘겨 같은 출처로 둔다(ADR-008·009).
# CSP 같은 배포용 헤더는 배포 창(A5-11)에서 더한다.
server_tokens off;

# 백엔드 주소를 요청 때마다 Docker 내부 DNS로 찾는다. 백엔드가 늦게 떠도 Nginx는 먼저 뜬다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 고객 앱(store)
server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/store;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # 포트까지 넘긴다(:3000·:3001). 백엔드가 주소를 만들 때 포트가 빠지지 않게.
        proxy_set_header Host $http_host;
        # 접속한 IP는 Nginx가 본 값만 넣는다. 요청자가 보낸 X-Forwarded-For를 이어 붙이지 않는다(ADR-008 로그인 제한).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 요청자가 보낸 다른 전달 헤더는 지운다(빈 값이면 Nginx가 넘기지 않는다). 백엔드(Tomcat)는 web에서 온 요청의
        # X-Forwarded-Host·Port를 믿으므로, 남겨 두면 요청자가 백엔드가 아는 주소·포트를 바꿀 수 있다(R1-01, ADR-008).
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
    }

    # 없는 정적 파일은 화면(index.html)으로 바꾸지 않고 404로 답한다.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# 관리자 앱(admin)
server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/admin;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $backend http://backend:8080;
