        # 요청자가 보낸 다른 전달 헤더는 지운다(빈 값이면 Nginx가 넘기지 않는다). 백엔드(Tomcat)는 web에서 온 요청의
        # X-Forwarded-Host·Port를 믿으므로, 남겨 두면 요청자가 백엔드가 아는 주소·포트를 바꿀 수 있다(R1-01, ADR-008).
