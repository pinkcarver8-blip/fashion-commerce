// 커머스 백엔드(모듈러 모놀리스). 스택과 버전은 작업진행.md A1, 공급망 규칙은 A5-12, 공통 규약은 ADR-010.
// R0-06에 골격과 모듈 경계 규칙(ArchUnit), R0-07에 웹·JPA·Flyway·Redis 연결을 더했다.

// 빌드 플러그인도 잠금 파일(buildscript-gradle.lockfile)에 적힌 버전만 쓴다.
buildscript {
	repositories {
		gradlePluginPortal()
	}
	configurations.classpath {
		resolutionStrategy.activateDependencyLocking()
	}
	dependencies {
		constraints {
			// Spring Boot 빌드 도구(buildpack-platform → commons-compress)가 데려오는 3.16.0에는 알려진 취약점이 있다
			// (긴 입력에서 끝없는 재귀, 3.18.0에서 고침). 서비스 쪽과 같은 판으로 올린다(R0-08 의존성 검토가 찾음).
			classpath('org.apache.commons:commons-lang3:3.20.0')
		}
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
	// 자바 코드 형식 검사(ADR-010: google-java-format AOSP). CI가 spotlessCheck를 돌린다(R0-08).
	id 'com.diffplug.spotless' version '8.9.0'
}

group = 'io.github.pinkcarver8_blip'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 모든 의존성 구성을 잠금 파일(gradle.lockfile)에 적힌 버전으로만 받는다. 잠금 상태가 없는 구성이 있으면 빌드가 실패한다.
// 버전을 바꿀 때는 ./gradlew dependencies --write-locks로 다시 만들고 PR에서 차이를 본다(A5-12).
dependencyLocking {
	lockAllConfigurations()
	lockMode = LockMode.STRICT
}

// Boot가 관리하지 않는 라이브러리는 버전을 직접 고정한다.
def querydslVersion = '7.7'     // OpenFeign 포크(ADR-007). Boot의 querydsl.version(5.1.0)은 원본 것이다
def archunitVersion = '1.5.1'

// lombok.config 시험(LombokConfigTest)이 쓰는 Lombok jar. 테스트 실행 클래스패스에는 넣지 않는다.
configurations {
	lombokCheck
}

dependencies {
	// 웹·DB·캐시(R0-07). 모두 A1 스택과 Boot 공식 스타터다.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// 읽기 조회 전용(ADR-007). 쓰는 곳은 <모듈>.query 패키지뿐이다(ArchUnit).
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// Lombok은 컴파일할 때만 쓴다. 완성된 서비스(jar)에는 들어가지 않는다(A5-12 Lombok 대책).
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core'
	testImplementation "com.tngtech.archunit:archunit:${archunitVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 시간대 확인 시험(ADR-010, R0-08): 실제 앱 설정으로 MySQL 컨테이너에 붙어 본다(A1 Testcontainers).
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

	// 아래는 규칙 위반 예시(src/test/.../archfixture)를 컴파일하는 데만 쓴다.
	testImplementation 'org.springframework:spring-web'
	testImplementation 'jakarta.persistence:jakarta.persistence-api'
	testImplementation 'org.springframework:spring-tx'   // 공유 모듈 위반 예시의 @Transactional
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// 예시 엔티티의 Q클래스를 실제로 만들어, 규칙이 Q클래스를 잘못 잡지 않는지 본다.
	testAnnotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	lombokCheck 'org.projectlombok:lombok'
}

// bootJar에 Boot의 추출 도구(jarmode-tools)를 넣지 않는다. 잠금 파일에 나오지 않는 jar라서 쓰지 않는다(R0-07 이미지도 jar 하나를 그대로 실행한다).
tasks.named('bootJar') {
	includeTools = false
}

tasks.withType(JavaCompile).configureEach {
	// lombok.config를 바꾸면 다시 컴파일한다(Gradle은 이 파일이 컴파일에 영향을 준다는 것을 스스로 모른다).
	inputs.file('lombok.config')
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:all'
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.36.1').aosp()
		removeUnusedImports()
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 시험 JVM도 실행 이미지(Dockerfile)와 같이 UTC로 고정한다(ADR-010).
	jvmArgs '-Duser.timezone=UTC'
	// LombokConfigTest가 Lombok jar 위치를 받는다.
	def lombokJar = configurations.lombokCheck
	inputs.files(lombokJar)
	inputs.file('lombok.config')
	doFirst {
		systemProperty 'lombok.jar', lombokJar.singleFile.absolutePath
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
