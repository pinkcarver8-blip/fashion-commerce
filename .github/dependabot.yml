# 부품 업데이트 알림(A5-12). 공개 7일이 지난 판만 알리고(cooldown), 자동으로 합치지 않는다.
# 보안 업데이트는 대기 없이 온다(GitHub 문서: cooldown은 판 업데이트에만 적용). 백엔드 업데이트 PR은
# 부품 지문 목록(verification-metadata.xml)을 따로 다시 만들어야 통과한다(R0-08 결정).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
