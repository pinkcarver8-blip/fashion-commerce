# 부품 업데이트 알림(A5-12). 공개 7일이 지난 판만 알리고(cooldown), 자동으로 합치지 않는다.
# 보안 업데이트는 대기 없이 온다(GitHub 문서: cooldown은 판 업데이트에만 적용). 백엔드 업데이트 PR은
# 부품 지문 목록(verification-metadata.xml)을 따로 다시 만들어야 통과한다(R0-08 결정).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # 지금 쓰는 판(Java 21: A1·ADR-002, Node 24: Dockerfile)보다 큰 판은 알리지 않는다(이슈 #72). docker는 보안 업데이트 대상이 아니라
    # (GitHub 문서 "Supported ecosystems", 2026-11-26 확인) 이 무시가 보안 알림을 막지 않는다.
    # 태그 꼬리(-jdk-noble, -alpine)가 붙은 판의 범위 비교 방식은 문서에 없다(미확인).
    ignore:
      - dependency-name: eclipse-temurin
        versions: [">= 22"]
      - dependency-name: node
        versions: [">= 25"]
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # 위 docker와 같은 이유. MySQL은 8.4 LTS에 머문다(A1).
    ignore:
      - dependency-name: mysql
        versions: [">= 8.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
