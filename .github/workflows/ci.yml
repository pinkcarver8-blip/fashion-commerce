# 모든 PR과 main에서 돈다. 하나라도 실패하면 main에 합칠 수 없다(main 보호의 필수 검사, A6).
# 외부 Actions는 커밋 SHA로 고정한다(A5-12). 비밀값을 쓰지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions 커밋 SHA 고정
        run: python3 tools/ci/check_actions_pinned.py
      - name: pnpm 공급망 설정
        if: ${{ !cancelled() }}
        run: python3 tools/ci/check_pnpm_policy.py
      - name: 문서 링크·ADR 목록(doc-check)
        if: ${{ !cancelled() }}
        run: python3 tools/doc-check/doc_check.py
      - name: PR 설명의 AI 기록 네 칸
        # Dependabot PR에는 AI 기록이 없다. 작성자가 dependabot[bot]일 때만 건너뛴다.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: python3 tools/ci/check_pr_body.py

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks 공식 배포 파일 받기(지문 확인)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 비밀값 검사(전체 이력, 토스 키 규칙 포함)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  backend:
    name: backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle wrapper 변조 검사
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 형식 검사(google-java-format AOSP)
        run: ./gradlew --no-daemon spotlessCheck
      - name: 빌드와 시험(ArchUnit·Lombok 설정·시간대 포함, 잠금 파일·부품 지문 확인)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: pnpm 준비(packageManager의 판 번호·지문대로)
        run: corepack enable
      - name: 고정 설치(잠금 파일과 다르면 실패)
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: 린트(store → admin 가져오기 금지 포함)
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: 형식 검사(Prettier)
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: 빌드
        if: ${{ !cancelled() }}
        run: pnpm build

  stack:
    name: stack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose로 띄워 확인(화면, /api, Redis 비밀번호, 포트, 시간대)
        run: bash tools/ci/stack_smoke.sh
