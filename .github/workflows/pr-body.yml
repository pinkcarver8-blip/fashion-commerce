# PR 설명의 AI 기록 네 칸(작업진행.md A3-2의 6). 설명을 고치면(edited) 이 검사만 다시 돈다.
name: pr-body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AI 기록 네 칸
        # Dependabot PR에는 AI 기록이 없다. 작성자가 dependabot[bot]일 때만 건너뛴다(bot 계정 이름은 사람이 가질 수 없다).
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: python3 tools/ci/check_pr_body.py
