# gitleaks 설정 (작업진행.md A5-10). 기본 규칙에 토스페이먼츠 키 규칙을 더한다.
# 기본 규칙(generic-api-key)은 key·secret 같은 변수 이름이 붙어 있어야 잡는다.
# 이름 없이 쓴 키(문서, 명령어, 리터럴)는 놓치므로 형식으로 잡는 전용 규칙을 둔다(2026-11-16 시험으로 확인).

[extend]
useDefault = true

[[rules]]
id = "tosspayments-live-key"
description = "토스페이먼츠 운영 키(live_). 어디에도 두지 않는다(E44)"
regex = '''\blive_(?:g?ck|g?sk)_[A-Za-z0-9]{10,}'''
keywords = ["live_"]

[[rules]]
id = "tosspayments-test-key"
description = "토스페이먼츠 테스트 키(test_). .env에만 둔다"
regex = '''\btest_(?:g?ck|g?sk)_[A-Za-z0-9]{10,}'''
keywords = ["test_"]
